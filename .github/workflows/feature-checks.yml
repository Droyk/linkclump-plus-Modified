name: Extension checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint source
        run: npm run eslint

      - name: Run unit tests
        run: npm run vitest:run

      - name: Build Chrome extension
        run: npm run build:chrome:prod

      - name: Build Firefox extension
        run: npm run build:firefox:prod

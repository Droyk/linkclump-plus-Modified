<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="light dark" />
	<title>Link Manager</title>
	<script type="module" src="./index.ts"></script>
	<style>
		:root {
			font: 13px/1.45 system-ui, sans-serif;
			color-scheme: light dark;
			background: Canvas;
			color: CanvasText;
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 280px; }
		header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px; border-bottom:1px solid color-mix(in srgb, CanvasText 18%, transparent); }
		h1 { margin:0; font-size:16px; }
		#pause { white-space:nowrap; }
		main { padding:10px; display:grid; gap:10px; }
		.toolbar { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
		.toolbar .wide { grid-column:1 / -1; }
		#add-form { display:grid; gap:6px; padding:9px; border:1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius:8px; }
		#add-form label { font-weight:600; }
		textarea { width:100%; min-height:86px; resize:vertical; font:12px/1.45 ui-monospace, monospace; }
		input, select, textarea, button { font:inherit; color:inherit; }
		input, select, textarea { min-width:0; padding:6px 7px; border:1px solid color-mix(in srgb, CanvasText 28%, transparent); border-radius:5px; background:Canvas; }
		button { padding:6px 8px; border:1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius:6px; background:ButtonFace; cursor:pointer; }
		button.primary { font-weight:600; background:Highlight; color:HighlightText; border-color:Highlight; }
		button:disabled { opacity:.45; cursor:default; }
		#list-select { width:100%; }
		#status { min-height:1.4em; color:GrayText; overflow-wrap:anywhere; }
		#summary { display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 8px; color:GrayText; }
		#items { display:grid; gap:6px; }
		.collection-heading { margin:8px 2px 0; padding-bottom:4px; border-bottom:1px solid color-mix(in srgb, CanvasText 18%, transparent); font-weight:700; }
		.item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:start; padding:8px; border:1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius:7px; cursor:pointer; }
		.item[aria-selected="true"] { outline:2px solid Highlight; outline-offset:0; background:color-mix(in srgb, Highlight 9%, Canvas); }
		.item-title { display:block; font-weight:600; overflow-wrap:anywhere; }
		.item-url { display:block; margin-top:2px; color:GrayText; font-size:11px; overflow-wrap:anywhere; }
		.item-meta { display:flex; flex-wrap:wrap; gap:4px 8px; margin-top:5px; color:GrayText; font-size:11px; }
		.item-actions { display:grid; gap:4px; }
		.item-actions button { padding:4px 6px; font-size:11px; white-space:nowrap; }
		#selection-actions { display:flex; flex-wrap:wrap; gap:5px; }
		.empty { padding:18px 8px; text-align:center; color:GrayText; border:1px dashed color-mix(in srgb, CanvasText 25%, transparent); border-radius:7px; }
		dialog { width:min(520px, calc(100vw - 28px)); max-height:80vh; border:1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius:10px; background:Canvas; color:CanvasText; }
		dialog::backdrop { background:rgba(0,0,0,.45); }
		dialog form { display:grid; gap:9px; }
		dialog h2 { margin:0; font-size:15px; }
		dialog p { margin:0; overflow-wrap:anywhere; }
		dialog select { width:100%; }
		.dialog-actions { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
		@media (max-width:360px) { .toolbar { grid-template-columns:1fr; } .toolbar .wide { grid-column:auto; } }
	</style>
</head>
<body>
	<header>
		<h1>Link Manager</h1>
		<button id="pause" type="button">Pause</button>
	</header>
	<main>
		<div class="toolbar">
			<label>Queue mode
				<select id="mode" class="wide">
					<option value="refill">A — Refill immediately</option>
					<option value="batch">B — Refill after batch</option>
					<option value="manual">C — Manual replenishment</option>
					<option value="sequential">D — Sequential direct</option>
				</select>
			</label>
			<label>Sidebar view
				<select id="view-mode">
					<option value="combined">Combined</option>
					<option value="collections">Collections</option>
				</select>
			</label>
			<label>Batch size
				<input id="batch-size" type="number" min="1" max="50" step="1" value="4" />
			</label>
			<label class="wide"><input id="single-click-open" type="checkbox" /> Single-click opens links (otherwise click selects; double-click opens)</label>
			<label>Save links to
				<select id="list-select"></select>
			</label>
			<button id="stage" type="button" class="primary wide">Stage next / Replenish</button>
			<button id="add-list" type="button">New collection</button>
			<button id="settings" type="button">Settings</button>
		</div>

		<form id="add-form">
			<label for="links-input">Add links to the queue</label>
			<textarea id="links-input" placeholder="Paste one URL per line&#10;Optional: Title, then press Tab, then URL"></textarea>
			<button id="add-links" type="submit" class="primary">Add links</button>
		</form>

		<div id="selection-actions">
			<button id="mark-read" type="button" disabled>Mark selected read</button>
			<button id="mark-unread" type="button" disabled>Mark selected unread</button>
			<button id="remove-selected" type="button" disabled>Remove selected</button>
			<button id="clear-selection" type="button" disabled>Clear selection</button>
		</div>

		<div id="summary"><span id="counts">Loading…</span><span id="mode-status"></span></div>
		<div id="items" role="listbox" aria-label="Saved links" aria-multiselectable="true"></div>
		<div id="status" role="status" aria-live="polite"></div>
	</main>

	<dialog id="duplicate-dialog">
		<form method="dialog">
			<h2>That link is already open</h2>
			<p id="duplicate-description"></p>
			<label for="duplicate-tab-select">Matching tab</label>
			<select id="duplicate-tab-select"></select>
			<div class="dialog-actions">
				<button type="submit" value="skip">Skip this link</button>
				<button type="submit" value="replace">Close selected tab and open a managed replacement</button>
				<button type="submit" value="activate" class="primary">Activate existing tab</button>
			</div>
		</form>
	</dialog>
</body>
</html>

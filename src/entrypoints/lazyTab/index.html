<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="light dark" />
	<script type="module" src="./index.ts"></script>
	<title>Deferred page</title>
	<style>
		:root { font: 16px/1.5 system-ui, sans-serif; color-scheme: light dark; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
		main { box-sizing: border-box; width: min(680px, calc(100% - 40px)); padding: 28px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 14px; }
		h1 { margin-top: 0; overflow-wrap: anywhere; }
		.muted { opacity: .7; }
		.destination { overflow-wrap: anywhere; }
		a { display: inline-block; margin-top: 12px; }
	</style>
</head>
<body>
	<main>
		<p class="muted">LINKCLUMP PLUS · DEFERRED TAB</p>
		<h1 id="title">Preparing deferred destination…</h1>
		<p id="message">The destination page has not been requested yet. It will load when this tab is activated.</p>
		<p id="destination" class="destination"></p>
		<a id="load-link" hidden>Load destination now</a>
	</main>
</body>
</html>
